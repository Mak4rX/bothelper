app = "bothelper-cash"
primary_region = "waw"  # Warsaw — найближче до України

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  PORT = "8080"
  DB_PATH = "/data/bothelper.db"

[mounts]
  source = "bothelper_data"
  destination = "/data"

[[services]]
  http_checks = []
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

[processes]
  app = "uvicorn webapp.main:app --host 0.0.0.0 --port 8080"
